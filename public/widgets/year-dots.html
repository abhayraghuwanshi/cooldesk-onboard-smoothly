<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Year in Dots — CoolDesk Widget</title>
<link rel="stylesheet" href="/widgets/base.css">
<style>
  .dots { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 3px; flex: 1; align-content: center; }
  .d { width: 100%; aspect-ratio: 1; border-radius: 2px; background: var(--faint); min-width: 3px; }
  .d.past { background: color-mix(in srgb, var(--accent) 55%, transparent); }
  .d.today { background: var(--fg); }
</style>
<script src="/widgets/cooldesk.js"></script>
<link rel="icon" href="/favicon.ico"></head>
<body>
<main class="widget">
  <div class="row spread">
    <span class="label" id="title"></span>
    <span class="label mono" id="count"></span>
  </div>
  <div class="dots" id="dots"></div>
</main>
<script>
  // The year as a GitHub-style dot grid — a quiet memento mori for your projects.
  var now = new Date();
  var year = now.getFullYear();
  var start = new Date(year, 0, 1);
  var days = (new Date(year + 1, 0, 1) - start) / 86400000;
  var today = Math.floor((now - start) / 86400000);
  var box = document.getElementById("dots");
  // Offset so columns are calendar weeks (Monday-start).
  var offset = (start.getDay() + 6) % 7;
  for (var i = 0; i < offset; i++) {
    var pad = document.createElement("span");
    box.appendChild(pad);
  }
  for (var d = 0; d < days; d++) {
    var el = document.createElement("span");
    el.className = "d" + (d < today ? " past" : d === today ? " today" : "");
    box.appendChild(el);
  }
  document.getElementById("title").textContent = year + " in dots";
  document.getElementById("count").textContent = "day " + (today + 1) + " / " + days;
</script>
</body>
</html>
