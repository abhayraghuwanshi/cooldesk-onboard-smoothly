<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scratchpad — CoolDesk Widget</title>
<link rel="stylesheet" href="/widgets/base.css">
<script src="/widgets/cooldesk.js"></script>
</head>
<body>
<main class="widget">
  <div class="row spread">
    <span class="label">Scratchpad</span>
    <span class="label" id="status"></span>
  </div>
  <textarea class="grow" id="pad" placeholder="Type anything — it autosaves." style="resize:none;line-height:1.55"></textarea>
</main>
<script>
  var pad = document.getElementById("pad");
  var status = document.getElementById("status");
  pad.value = cooldesk.store.get("notes", "");
  var t = null;
  pad.oninput = function () {
    status.textContent = "…";
    clearTimeout(t);
    t = setTimeout(function () {
      cooldesk.store.set("notes", pad.value);
      status.textContent = "Saved";
      setTimeout(function () { status.textContent = ""; }, 1200);
    }, 400);
  };
</script>
</body>
</html>
