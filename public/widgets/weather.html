<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather — CoolDesk Widget</title>
<link rel="stylesheet" href="/widgets/base.css">
<script src="/widgets/cooldesk.js"></script>
<link rel="icon" href="/favicon.ico"></head>
<body>
<main class="widget" style="justify-content:center;gap:8px">
  <span class="label" id="city"></span>
  <div class="row" style="gap:12px">
    <span id="icon" style="font-size:38px">·</span>
    <span class="big mono" id="temp" style="font-size:44px">--°</span>
    <div class="stack grow" style="gap:3px;align-items:flex-end">
      <span class="muted" id="desc" style="font-size:12px">Loading…</span>
      <span class="muted mono" id="wind" style="font-size:11px"></span>
    </div>
  </div>
</main>
<script>
  // Config: ?lat=&lon=&city= (defaults: Mumbai). Data: open-meteo.com, no API key.
  var lat = cooldesk.get("lat", "19.076");
  var lon = cooldesk.get("lon", "72.877");
  document.getElementById("city").textContent = cooldesk.get("city", "Mumbai");

  var CODES = {
    0: ["☀️", "Clear sky"], 1: ["🌤️", "Mostly clear"], 2: ["⛅", "Partly cloudy"], 3: ["☁️", "Overcast"],
    45: ["🌫️", "Fog"], 48: ["🌫️", "Rime fog"], 51: ["🌦️", "Light drizzle"], 53: ["🌦️", "Drizzle"],
    55: ["🌧️", "Heavy drizzle"], 61: ["🌧️", "Light rain"], 63: ["🌧️", "Rain"], 65: ["🌧️", "Heavy rain"],
    71: ["🌨️", "Light snow"], 73: ["🌨️", "Snow"], 75: ["❄️", "Heavy snow"], 80: ["🌧️", "Showers"],
    81: ["🌧️", "Showers"], 82: ["⛈️", "Heavy showers"], 95: ["⛈️", "Thunderstorm"], 96: ["⛈️", "Storm + hail"], 99: ["⛈️", "Storm + hail"]
  };

  function load() {
    fetch("https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
      "&current=temperature_2m,weather_code,wind_speed_10m")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var c = d.current;
        var info = CODES[c.weather_code] || ["·", "—"];
        document.getElementById("temp").textContent = Math.round(c.temperature_2m) + "°";
        document.getElementById("icon").textContent = info[0];
        document.getElementById("desc").textContent = info[1];
        document.getElementById("wind").textContent = "wind " + Math.round(c.wind_speed_10m) + " km/h";
      })
      .catch(function () {
        document.getElementById("desc").textContent = "Offline";
      });
  }
  load();
  setInterval(load, 15 * 60 * 1000);
</script>
</body>
</html>
