<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tasks — CoolDesk Widget</title>
<link rel="stylesheet" href="/widgets/base.css">
<script src="/widgets/cooldesk.js"></script>
<style>
  .task { display: flex; align-items: center; gap: 9px; padding: 7px 2px; border-bottom: 1px solid var(--faint); font-size: 13px; }
  .task:last-child { border-bottom: none; }
  .task input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; flex-shrink: 0; }
  .task.done span { text-decoration: line-through; color: var(--muted); }
  .task button { padding: 2px 7px; opacity: 0; }
  .task:hover button { opacity: 1; }
</style>
</head>
<body>
<main class="widget">
  <div class="row spread">
    <span class="label">Tasks</span>
    <button class="ghost" id="clear">Clear done</button>
  </div>
  <form class="row" id="form">
    <input class="grow" id="input" placeholder="Add a task…" maxlength="120" autocomplete="off">
  </form>
  <div class="list" id="items"></div>
</main>
<script>
  var tasks = cooldesk.store.get("todo", [
    { text: "Try CoolDesk widgets", done: false },
    { text: "Plan the week", done: false }
  ]);
  function save() { cooldesk.store.set("todo", tasks); }
  function render() {
    var box = document.getElementById("items");
    box.innerHTML = "";
    tasks.forEach(function (t, i) {
      var el = document.createElement("div");
      el.className = "task" + (t.done ? " done" : "");
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = t.done;
      cb.onchange = function () { t.done = cb.checked; save(); render(); };
      var span = document.createElement("span");
      span.className = "grow";
      span.textContent = t.text;
      var del = document.createElement("button");
      del.className = "ghost";
      del.textContent = "×";
      del.onclick = function () { tasks.splice(i, 1); save(); render(); };
      el.append(cb, span, del);
      box.appendChild(el);
    });
  }
  document.getElementById("form").onsubmit = function (e) {
    e.preventDefault();
    var input = document.getElementById("input");
    var text = input.value.trim();
    if (text) { tasks.unshift({ text: text, done: false }); input.value = ""; save(); render(); }
  };
  document.getElementById("clear").onclick = function () {
    tasks = tasks.filter(function (t) { return !t.done; });
    save(); render();
  };
  render();
</script>
</body>
</html>
