<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub Contributions — CoolDesk Widget</title>
<link rel="stylesheet" href="/widgets/base.css">
<script src="/widgets/cooldesk.js"></script>
<style>
  img { width: 100%; height: auto; border-radius: 6px; }
  [data-theme="dark"] img { filter: invert(0.92) hue-rotate(180deg); }
</style>
<link rel="icon" href="/favicon.ico"></head>
<body>
<main class="widget">
  <div class="row spread">
    <span class="label" id="title">GitHub contributions</span>
    <form class="row" id="form" style="gap:4px">
      <input id="user" placeholder="username" style="width:110px;font-size:11px;padding:4px 8px">
    </form>
  </div>
  <div class="grow center" id="chartBox">
    <img id="chart" alt="GitHub contribution graph" loading="lazy">
  </div>
</main>
<script>
  // Chart image: ghchart.rshah.org (public service rendering GitHub's contribution graph).
  var user = cooldesk.get("user", cooldesk.store.get("gh-user", "torvalds"));
  var img = document.getElementById("chart");
  function render() {
    document.getElementById("title").textContent = "GitHub · " + user;
    img.src = "https://ghchart.rshah.org/2563eb/" + encodeURIComponent(user);
  }
  img.onerror = function () {
    document.getElementById("chartBox").innerHTML = '<span class="muted" style="font-size:12px">Could not load chart</span>';
  };
  document.getElementById("form").onsubmit = function (e) {
    e.preventDefault();
    var v = document.getElementById("user").value.trim();
    if (v) { user = v; cooldesk.store.set("gh-user", v); render(); }
  };
  render();
</script>
</body>
</html>
