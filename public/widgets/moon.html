<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moon Phase — CoolDesk Widget</title>
<link rel="stylesheet" href="/widgets/base.css">
<script src="/widgets/cooldesk.js"></script>
</head>
<body>
<main class="widget" style="justify-content:center;gap:8px">
  <span class="label">Moon tonight</span>
  <div class="row" style="gap:14px">
    <span id="icon" style="font-size:44px"></span>
    <div class="stack grow" style="gap:4px">
      <span id="name" style="font-size:16px;font-weight:700"></span>
      <span class="muted mono" id="detail" style="font-size:11px"></span>
    </div>
  </div>
</main>
<script>
  // Computed locally from the synodic month — no network needed.
  var SYNODIC = 29.53058867;
  var KNOWN_NEW_MOON = Date.UTC(2000, 0, 6, 18, 14); // reference new moon
  var PHASES = [
    ["🌑", "New Moon"], ["🌒", "Waxing Crescent"], ["🌓", "First Quarter"], ["🌔", "Waxing Gibbous"],
    ["🌕", "Full Moon"], ["🌖", "Waning Gibbous"], ["🌗", "Last Quarter"], ["🌘", "Waning Crescent"]
  ];
  var age = ((Date.now() - KNOWN_NEW_MOON) / 86400000) % SYNODIC;
  var frac = age / SYNODIC;
  var idx = Math.round(frac * 8) % 8;
  var illumination = Math.round((1 - Math.cos(2 * Math.PI * frac)) / 2 * 100);
  var toFull = frac < 0.5 ? (0.5 - frac) * SYNODIC : (1.5 - frac) * SYNODIC;

  document.getElementById("icon").textContent = PHASES[idx][0];
  document.getElementById("name").textContent = PHASES[idx][1];
  document.getElementById("detail").textContent =
    illumination + "% lit · " + Math.round(toFull) + "d to full moon";
</script>
</body>
</html>
