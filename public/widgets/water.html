<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Water Tracker — CoolDesk Widget</title>
<link rel="stylesheet" href="/widgets/base.css?v=3">
<style>
  .glasses { display: flex; gap: 6px; flex-wrap: wrap; }
  .glass { width: 20px; height: 26px; border: 1.5px solid var(--faint); border-radius: 3px 3px 6px 6px; position: relative; overflow: hidden; }
  .glass.full { border-color: var(--accent); }
  .glass.full::after { content: ""; position: absolute; inset: 25% 0 0 0; background: color-mix(in srgb, var(--accent) 55%, transparent); }
</style>
<script src="/widgets/cooldesk.js?v=3"></script>
<link rel="icon" href="/favicon.ico"></head>
<body>
<main class="widget" style="justify-content:center;gap:12px">
  <div class="row spread">
    <span class="label">Water</span>
    <span class="label" id="count"></span>
  </div>
  <div class="glasses" id="glasses"></div>
  <div class="row">
    <button class="primary grow" id="add">+ Glass</button>
    <button class="ghost" id="minus">−</button>
  </div>
</main>
<script>
  var goal = parseInt(cooldesk.get("goal", "8"), 10);
  var todayKey = new Date().toLocaleDateString("en-CA");
  var state = cooldesk.store.get("water", {});
  if (state.date !== todayKey) state = { date: todayKey, n: 0 };

  function save() { cooldesk.store.set("water", state); }
  function render() {
    var box = document.getElementById("glasses");
    box.innerHTML = "";
    for (var i = 0; i < Math.max(goal, state.n); i++) {
      var g = document.createElement("div");
      g.className = "glass" + (i < state.n ? " full" : "");
      box.appendChild(g);
    }
    document.getElementById("count").textContent = state.n + " / " + goal +
      (state.n >= goal ? " · Done 💧" : "");
  }
  document.getElementById("add").onclick = function () { state.n++; save(); render(); };
  document.getElementById("minus").onclick = function () { if (state.n > 0) state.n--; save(); render(); };
  render();
</script>
</body>
</html>
