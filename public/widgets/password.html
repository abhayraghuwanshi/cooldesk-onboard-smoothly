<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password Generator — CoolDesk Widget</title>
<link rel="stylesheet" href="/widgets/base.css?v=3">
<script src="/widgets/cooldesk.js?v=3"></script>
<link rel="icon" href="/favicon.ico"></head>
<body>
<main class="widget" style="justify-content:center;gap:10px">
  <div class="row spread">
    <span class="label">Password generator</span>
    <span class="label mono" id="lenLabel">16</span>
  </div>
  <div class="card mono" id="output" style="font-size:15px;word-break:break-all;cursor:pointer" title="Click to copy"></div>
  <input type="range" id="len" min="8" max="40" value="16" style="accent-color:var(--accent);padding:0;border:0;background:transparent">
  <div class="row" style="font-size:11px;gap:12px">
    <label class="row" style="gap:4px"><input type="checkbox" id="digits" checked style="width:13px;height:13px;accent-color:var(--accent)"> 0-9</label>
    <label class="row" style="gap:4px"><input type="checkbox" id="symbols" checked style="width:13px;height:13px;accent-color:var(--accent)"> !@#</label>
    <span class="grow"></span>
    <button id="gen">New</button>
    <button class="primary" id="copy">Copy</button>
  </div>
</main>
<script>
  // Generated locally with crypto.getRandomValues; nothing leaves the page.
  var LOWER = "abcdefghijkmnopqrstuvwxyz", UPPER = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  var DIGITS = "23456789", SYMBOLS = "!@#$%^&*-_=+?";
  var current = "";
  function generate() {
    var pool = LOWER + UPPER;
    if (document.getElementById("digits").checked) pool += DIGITS;
    if (document.getElementById("symbols").checked) pool += SYMBOLS;
    var len = parseInt(document.getElementById("len").value, 10);
    document.getElementById("lenLabel").textContent = len;
    var bytes = new Uint32Array(len);
    crypto.getRandomValues(bytes);
    current = "";
    for (var i = 0; i < len; i++) current += pool[bytes[i] % pool.length];
    document.getElementById("output").textContent = current;
  }
  function copy() {
    navigator.clipboard.writeText(current).then(function () {
      var btn = document.getElementById("copy");
      btn.textContent = "Copied ✓";
      setTimeout(function () { btn.textContent = "Copy"; }, 1200);
    });
  }
  document.getElementById("len").oninput = generate;
  document.getElementById("digits").onchange = generate;
  document.getElementById("symbols").onchange = generate;
  document.getElementById("gen").onclick = generate;
  document.getElementById("copy").onclick = copy;
  document.getElementById("output").onclick = copy;
  generate();
</script>
</body>
</html>
