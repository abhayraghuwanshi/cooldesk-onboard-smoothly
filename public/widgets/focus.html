<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Focus — CoolDesk Widget</title>
<link rel="stylesheet" href="/widgets/base.css?v=4">
<script src="/widgets/cooldesk.js?v=4"></script>
<link rel="icon" href="/favicon.ico"></head>
<body>
<main class="widget" style="justify-content:center;gap:12px">
  <span class="label">Main focus today</span>
  <form id="ask" class="row">
    <input class="grow" id="input" placeholder="What's your main thing today?" maxlength="90" autocomplete="off">
  </form>
  <div id="show" class="row" style="display:none;gap:10px">
    <input type="checkbox" id="done" style="width:18px;height:18px;accent-color:var(--accent);flex-shrink:0">
    <span class="grow" id="text" style="font-size:19px;font-weight:700;line-height:1.35;cursor:pointer" title="Click to edit"></span>
  </div>
</main>
<script>
  var todayKey = new Date().toLocaleDateString("en-CA");
  var state = cooldesk.store.get("focus", {});
  if (state.date !== todayKey) state = { date: todayKey, text: "", done: false };

  var ask = document.getElementById("ask"), show = document.getElementById("show");
  function save() { cooldesk.store.set("focus", state); }
  function render() {
    var has = !!state.text;
    ask.style.display = has ? "none" : "flex";
    show.style.display = has ? "flex" : "none";
    var text = document.getElementById("text");
    text.textContent = state.text;
    text.style.textDecoration = state.done ? "line-through" : "none";
    text.style.color = state.done ? "var(--muted)" : "var(--fg)";
    document.getElementById("done").checked = state.done;
  }
  ask.onsubmit = function (e) {
    e.preventDefault();
    var v = document.getElementById("input").value.trim();
    if (v) { state.text = v; state.done = false; save(); render(); }
  };
  document.getElementById("done").onchange = function () { state.done = this.checked; save(); render(); };
  document.getElementById("text").onclick = function () {
    document.getElementById("input").value = state.text;
    state.text = "";
    save(); render();
    document.getElementById("input").focus();
  };
  render();
</script>
</body>
</html>
