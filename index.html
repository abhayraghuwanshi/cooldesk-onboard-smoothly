<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    if (window.location.hostname === 'www.cool-desk.com') {
      window.location.replace('https://cool-desk.com' + window.location.pathname + window.location.search + window.location.hash);
    }
  </script>

  <title>%VITE_TITLE%</title>

  <meta name="description" content="%VITE_DESCRIPTION%" />

  <meta name="keywords"
    content="app launcher, app switcher, spotlight search, project workspace, context switching, universal search, tab manager, new tab page, raycast alternative, alfred alternative, launcher for windows, free browser extension, no sign-in required, productivity" />

  <!-- Canonical is set per-route by the <SEO> component (react-helmet-async).
       A static canonical here would point every route at the homepage. -->

  <meta property="og:title" content="%VITE_TITLE%" />
  <meta property="og:description" content="%VITE_DESCRIPTION%" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="%VITE_CANONICAL%" />
  <meta property="og:image" content="https://cool-desk.com/og-cover.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="%VITE_SITE_NAME%" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="%VITE_TITLE%" />
  <meta name="twitter:description" content="%VITE_DESCRIPTION%" />
  <meta name="twitter:image" content="https://cool-desk.com/og-cover.png" />

  <link rel="icon" type="image/png" href="/cooldesk.png" />

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F1YM216TKY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-F1YM216TKY');
  </script>

  <!-- Preload the LCP hero image so it's discoverable before JS renders -->
  <link rel="preload" href="/cooldesk-new.png" as="image" fetchpriority="high" />
  <link rel="dns-prefetch" href="//fonts.googleapis.com" />

  <!-- Performance optimizations -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
  />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "CoolDesk",
    "alternateName": ["Cool Desk", "Cool-Desk"],
    "operatingSystem": "Windows, macOS, Chrome, Edge, Brave",
    "applicationCategory": "ProductivityApplication",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "description": "CoolDesk is a free launcher built around your projects. Spotlight search (Alt+K) finds and opens any browser tab, desktop app, link, note or file instantly, and workspaces keep everything grouped by project. Works on Windows and macOS. No sign-in required."
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "url": "https://cool-desk.com/",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://cool-desk.com/library?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "itemListElement": [
      {
        "@type": "SiteNavigationElement",
        "position": 1,
        "name": "How to Use",
        "description": "Master autosave and shared workspaces",
        "url": "https://cool-desk.com/how-to-use"
      },
      {
        "@type": "SiteNavigationElement",
        "position": 2,
        "name": "Pricing",
        "description": "Free and Pro plans",
        "url": "https://cool-desk.com/pricing"
      },
      {
        "@type": "SiteNavigationElement",
        "position": 3,
        "name": "Blog",
        "description": "Latest updates and productivity tips",
        "url": "https://cool-desk.com/blog"
      },
      {
        "@type": "SiteNavigationElement",
        "position": 4,
        "name": "Library",
        "description": "Library of curated tools, apps, and workspaces",
        "url": "https://cool-desk.com/library"
      }
    ]
  }
  </script>
</head>

<body>
  <div id="root">
    <noscript>
      <h1>CoolDesk — Launcher &amp; Spotlight Search, Organized by Project</h1>
      <p>CoolDesk is a free launcher built around your projects. Press Alt+K to find and open any tab, app, link or note across your browser and desktop. Works on Windows and macOS — no sign-in required.</p>
    </noscript>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
