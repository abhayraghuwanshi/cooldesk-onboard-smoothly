<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    if (window.location.hostname === 'www.cool-desk.com') {
      window.location.replace('https://cool-desk.com' + window.location.pathname + window.location.search + window.location.hash);
    }
  </script>

  <title>%VITE_TITLE%</title>

  <meta name="description" content="%VITE_DESCRIPTION%" />

  <meta name="keywords"
    content="developer workspace, new tab page, browser extension, project workspace, spotlight search, tab management, free browser extension, no sign-in required, productivity dashboard, AI workspace" />

  <link rel="canonical" href="%VITE_CANONICAL%" />

  <meta property="og:title" content="%VITE_TITLE%" />
  <meta property="og:description" content="%VITE_DESCRIPTION%" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="%VITE_CANONICAL%" />
  <meta property="og:image" content="https://cool-desk.com/cooldesk.png" />
  <meta property="og:site_name" content="%VITE_SITE_NAME%" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="%VITE_TITLE%" />
  <meta name="twitter:description" content="%VITE_DESCRIPTION%" />
  <meta name="twitter:image" content="https://cool-desk.com/cooldesk.png" />

  <link rel="icon" type="image/png" href="/cooldesk.png" />

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F1YM216TKY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-F1YM216TKY');
  </script>

  <!-- Preload critical resources -->
  <link rel="preload" href="/cooldesk.png" as="image" />
  <link rel="dns-prefetch" href="//fonts.googleapis.com" />

  <!-- Performance optimizations -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "CoolDesk",
    "alternateName": ["Cool Desk", "Cool-Desk"],
    "operatingSystem": "Chrome, Edge, Brave, Windows",
    "applicationCategory": "ProductivityApplication",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "description": "CoolDesk is a free browser extension and desktop app that organizes your projects. Group browser tabs, desktop apps, links, notes, and files by project in one new tab. Spotlight search (Alt+K), AI SmartWorkspace, and smart tab management. No sign-in required.",
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.9",
      "ratingCount": "120"
    }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "url": "https://cool-desk.com/",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://cool-desk.com/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "itemListElement": [
      {
        "@type": "SiteNavigationElement",
        "position": 1,
        "name": "How to Use",
        "description": "Master autosave and shared workspaces",
        "url": "https://cool-desk.com/how-to-use"
      },
      {
        "@type": "SiteNavigationElement",
        "position": 2,
        "name": "Pricing",
        "description": "Free and Pro plans",
        "url": "https://cool-desk.com/pricing"
      },
      {
        "@type": "SiteNavigationElement",
        "position": 3,
        "name": "Blog",
        "description": "Latest updates and productivity tips",
        "url": "https://cool-desk.com/blog"
      },
      {
        "@type": "SiteNavigationElement",
        "position": 4,
        "name": "Search",
        "description": "Discover trending workspaces",
        "url": "https://cool-desk.com/search"
      }
    ]
  }
  </script>
</head>

<body>
  <div id="root">
    <noscript>
      <h1>CoolDesk — New Tab Workspace &amp; AI Spotlight for Developers</h1>
      <p>CoolDesk replaces your new tab with a project workspace. Group tabs, apps, links and notes by project. Free browser extension with AI spotlight search — no sign-in required.</p>
    </noscript>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
