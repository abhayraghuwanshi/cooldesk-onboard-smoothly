# Reference config for the SECOND Firebase App Hosting backend (newtab.kazekit.com).
#
# Your apphosting.yaml is gitignored (config is managed in the Firebase console),
# so the important part here is the BUILD_SITE env var. Set it on the newtab
# backend — either by committing an apphosting.yaml for that backend, or via
# Firebase console > App Hosting > <backend> > Settings > Environment variables.
#
# BUILD_SITE=newtab makes `npm run build` run `vite build --mode newtab`,
# which selects the newtab branding/content and the newtab SEO tokens.

runConfig:
  minInstances: 0
  startupTimeoutSeconds: 300

env:
  - variable: BUILD_SITE
    value: newtab
    availability:
      - BUILD
